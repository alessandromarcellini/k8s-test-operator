---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - demo.test.com
  resources:
  - toys
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - demo.test.com
  resources:
  - toys/finalizers
  verbs:
  - update
- apiGroups:
  - demo.test.com
  resources:
  - toys/status
  verbs:
  - get
  - patch
  - update
